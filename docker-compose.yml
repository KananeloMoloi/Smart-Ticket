services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticketpass
      POSTGRES_DB: ticketing
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticketing"]
      interval: 5s
      retries: 15
  flask-ai:
    build: ./flask-ai
    environment:
      PORT: 5000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-change-this-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports: ["5000:5000"]
  node-api:
    build: ./node-api
    depends_on:
      postgres: {condition: service_healthy}
      flask-ai: {condition: service_started}
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://ticket:ticketpass@postgres:5432/ticketing?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      AI_SERVICE_URL: http://flask-ai:5000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-change-this-token}
      UPLOAD_DIR: /app/uploads
    ports: ["4000:4000"]
    volumes: ["uploads:/app/uploads"]
    command: ["sh", "-c", "npx prisma db push && node src/server.js"]
volumes:
  pgdata:
  uploads:
